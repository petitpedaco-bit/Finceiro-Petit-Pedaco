services:
  - type: web
    name: petit-pedaco-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://petitpedaco-bit.github.io
